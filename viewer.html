<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LiDAR Point Cloud</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0f; overflow: hidden; }
    canvas { display: block; }

    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      color: #aaa;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.8;
      pointer-events: none;
    }
    #ui strong { color: #fff; font-size: 13px; }

    #layers {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: monospace;
      font-size: 12px;
    }
    .layer-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 5px 10px;
      border-radius: 4px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #ccc;
      user-select: none;
    }
    .layer-toggle:hover { background: rgba(255,255,255,0.1); }
    .layer-toggle input { cursor: pointer; accent-color: #31c884; }
    .swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    #color-modes {
      display: flex;
      gap: 4px;
      padding: 5px 10px;
      border-radius: 4px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .cm-btn {
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.15);
      background: transparent;
      color: #aaa;
      font-family: monospace;
      font-size: 11px;
    }
    .cm-btn:hover { background: rgba(255,255,255,0.1); }
    .cm-btn.active { background: #31c884; color: #000; border-color: #31c884; }

    #legend {
      position: absolute;
      bottom: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      font-family: monospace;
      font-size: 11px;
      color: #aaa;
    }
    #gradient {
      width: 12px; height: 120px;
      border-radius: 2px;
      background: linear-gradient(to bottom, #f7f79e, #31c884, #1a6b8a, #0d1b4b);
    }
    .legend-row { display: flex; align-items: center; gap: 6px; }

    #cls-legend { display: flex; flex-direction: column; gap: 3px; align-items: flex-end; }
    .cls-row { display: flex; align-items: center; gap: 6px; font-family: monospace; font-size: 10px; color: #aaa; }
    .cls-swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-family: monospace;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
<div id="loading">Initialising…</div>

<div id="ui" style="display:none">
  <strong id="title">LiDAR — Kullberg</strong><br><br>
  drag · rotate<br>
  right-drag · pan<br>
  scroll · zoom
</div>

<div id="layers">
  <div id="color-modes">
    <button class="cm-btn active" data-mode="height">height</button>
    <button class="cm-btn" data-mode="classification">class</button>
    <button class="cm-btn" id="btn-rgb" data-mode="rgb" style="display:none">rgb</button>
  </div>
  <label class="layer-toggle">
    <input type="checkbox" checked data-layer="pointCloud">
    <span class="swatch" style="background:#5ad"></span>
    Points — <span id="pt-count">—</span>
  </label>
  <label class="layer-toggle">
    <input type="checkbox" checked data-layer="p2r">
    <span class="swatch" style="background:#f44"></span>
    Trees (p2r) — <span id="p2r-count"></span>
  </label>
  <label class="layer-toggle">
    <input type="checkbox" checked data-layer="pitfree">
    <span class="swatch" style="background:#4f4"></span>
    Trees (pit-free) — <span id="pitfree-count"></span>
  </label>
</div>

<div id="legend" style="display:none">
  <div id="height-legend">
    <div class="legend-row"><span id="z-max"></span></div>
    <div class="legend-row"><div id="gradient"></div></div>
    <div class="legend-row"><span id="z-min"></span></div>
  </div>
  <div id="cls-legend" style="display:none"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "/three@0.183.2/three.module.min.js",
    "three/addons/": "/three@0.183.2/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import copcLib from '/copc-bundle.js';
const { Copc, Las } = copcLib;

// ── Color maps ────────────────────────────────────────────────────────────────

const MAKO = [
  [13/255,  27/255,  75/255],
  [26/255, 107/255, 138/255],
  [49/255, 200/255, 132/255],
  [247/255, 247/255, 158/255],
];

function heightColor(t, out, i) {
  t = Math.max(0, Math.min(1, t));
  const s = t * (MAKO.length - 1);
  const lo = Math.min(Math.floor(s), MAKO.length - 2);
  const f  = s - lo;
  out[i]   = MAKO[lo][0] + f * (MAKO[lo+1][0] - MAKO[lo][0]);
  out[i+1] = MAKO[lo][1] + f * (MAKO[lo+1][1] - MAKO[lo][1]);
  out[i+2] = MAKO[lo][2] + f * (MAKO[lo+1][2] - MAKO[lo][2]);
}

// prettier-ignore
const CLS_RGB = new Float32Array([
  0.50,0.50,0.50, // 0  never classified
  0.50,0.50,0.50, // 1  unassigned
  0.60,0.45,0.25, // 2  ground
  0.55,0.75,0.40, // 3  low vegetation
  0.30,0.60,0.25, // 4  medium vegetation
  0.10,0.40,0.15, // 5  high vegetation
  0.80,0.30,0.20, // 6  building
  0.90,0.10,0.90, // 7  low noise
  0.40,0.40,0.40, // 8  reserved
  0.20,0.40,0.80, // 9  water
  0.30,0.30,0.35, // 10 rail
  0.65,0.65,0.65, // 11 road surface
  0.40,0.40,0.40, // 12 reserved
  0.90,0.80,0.10, // 13 wire – guard
  0.90,0.60,0.10, // 14 wire – conductor
  0.60,0.20,0.20, // 15 transmission tower
  0.80,0.50,0.10, // 16 wire connector
  0.60,0.50,0.35, // 17 bridge deck
  1.00,0.00,0.50, // 18 high noise
]);

const CLS_LABELS = [
  'Never classified','Unassigned','Ground','Low vegetation','Medium vegetation',
  'High vegetation','Building','Low noise','Reserved','Water','Rail',
  'Road surface','Reserved','Wire – guard','Wire – conductor','Transmission tower',
  'Wire connector','Bridge deck','High noise',
];

function classColor(cls, out, i) {
  const c = Math.min(cls, 18) * 3;
  out[i]   = CLS_RGB[c];
  out[i+1] = CLS_RGB[c + 1];
  out[i+2] = CLS_RGB[c + 2];
}

// ── Scene ─────────────────────────────────────────────────────────────────────

const scene    = new THREE.Scene();
const camera   = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100000);
camera.up.set(0, 0, 1);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ── Camera controls ───────────────────────────────────────────────────────────

let sph    = { theta: 0.4, phi: 0.5, r: 1000 };
let target = new THREE.Vector3();
let drag = false, rightDrag = false, prev = { x: 0, y: 0 };
let prevPinchDist = null;

function pinchDist(touches) {
  return Math.hypot(
    touches[0].clientX - touches[1].clientX,
    touches[0].clientY - touches[1].clientY
  );
}

function render() {
  camera.position.set(
    target.x + sph.r * Math.sin(sph.phi) * Math.sin(sph.theta),
    target.y + sph.r * Math.sin(sph.phi) * Math.cos(sph.theta) * -1.0,
    target.z + sph.r * Math.cos(sph.phi)
  );
  camera.lookAt(target);
  renderer.render(scene, camera);
}

renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

renderer.domElement.addEventListener('mousedown', e => {
  drag = true; rightDrag = e.button === 2;
  prev = { x: e.clientX, y: e.clientY };
});

renderer.domElement.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    rightDrag = true;
    prevPinchDist = pinchDist(e.touches);
    prev = {
      x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
      y: (e.touches[0].clientY + e.touches[1].clientY) / 2
    };
  } else {
    rightDrag = false; prevPinchDist = null;
    prev = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
  drag = true;
});

['mouseup', 'touchend'].forEach(ev => window.addEventListener(ev, () => drag = false));

window.addEventListener('mousemove', e => {
  if (!drag) return;
  applyDrag(e.clientX - prev.x, e.clientY - prev.y);
  prev = { x: e.clientX, y: e.clientY };
  render();
});

window.addEventListener('touchmove', e => {
  if (!drag) return;
  e.preventDefault();
  if (e.touches.length === 2) {
    const d = pinchDist(e.touches);
    if (prevPinchDist !== null) sph.r = Math.max(10, Math.min(50000, sph.r * (prevPinchDist / d)));
    prevPinchDist = d;
  }
  const x = e.touches.length === 2
    ? (e.touches[0].clientX + e.touches[1].clientX) / 2 : e.touches[0].clientX;
  const y = e.touches.length === 2
    ? (e.touches[0].clientY + e.touches[1].clientY) / 2 : e.touches[0].clientY;
  applyDrag(x - prev.x, y - prev.y);
  prev = { x, y };
  render();
}, { passive: false });

renderer.domElement.addEventListener('wheel', e => {
  sph.r = Math.max(10, Math.min(50000, sph.r * (1 + e.deltaY * 0.001)));
  scheduleLODUpdate();
  render();
}, { passive: true });

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  render();
});

function applyDrag(dx, dy) {
  if (rightDrag) {
    const right = new THREE.Vector3(Math.cos(sph.theta), 0, -Math.sin(sph.theta));
    target.addScaledVector(right, -dx * sph.r * 0.001);
    target.addScaledVector(new THREE.Vector3(0, 1, 0), dy * sph.r * 0.001);
  } else {
    sph.theta -= dx * 0.005;
    sph.phi = Math.max(0.05, Math.min(Math.PI * 0.95, sph.phi - dy * 0.005));
  }
  scheduleLODUpdate();
}

// ── Layer registry ────────────────────────────────────────────────────────────

const layers = {};

document.querySelectorAll('#layers input[type=checkbox]').forEach(checkbox => {
  checkbox.addEventListener('change', () => {
    const g = layers[checkbox.dataset.layer];
    if (g) { g.visible = checkbox.checked; render(); }
  });
});

function addLayer(key, group) {
  layers[key] = group;
  const cb = document.querySelector(`input[data-layer="${key}"]`);
  if (cb) group.visible = cb.checked;
  scene.add(group);
  render();
}

// ── Color mode ────────────────────────────────────────────────────────────────

let colorMode = 'height';
let globalZMin = 0, globalZMax = 1;

function applyTileColors(tile, from, to) {
  const span = globalZMax - globalZMin || 1;
  for (let i = from; i < to; i++) {
    const ci = i * 3;
    if (colorMode === 'height') {
      heightColor((tile.zArr[i] - globalZMin) / span, tile.colArr, ci);
    } else if (colorMode === 'classification') {
      classColor(tile.clsArr[i], tile.colArr, ci);
    } else if (colorMode === 'rgb' && tile.hasRGB) {
      tile.colArr[ci]   = tile.rgbArr[ci]   / 255;
      tile.colArr[ci+1] = tile.rgbArr[ci+1] / 255;
      tile.colArr[ci+2] = tile.rgbArr[ci+2] / 255;
    } else {
      heightColor((tile.zArr[i] - globalZMin) / span, tile.colArr, ci);
    }
  }
}

function recolorAll() {
  for (const tile of tileStates) {
    if (!tile.loadedCount) continue;
    applyTileColors(tile, 0, tile.loadedCount);
    if (tile.geo) tile.geo.attributes.color.needsUpdate = true;
  }
  render();
}

document.querySelectorAll('.cm-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    colorMode = btn.dataset.mode;
    document.querySelectorAll('.cm-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const isHeight = colorMode === 'height';
    document.getElementById('height-legend').style.display = isHeight ? '' : 'none';
    document.getElementById('cls-legend').style.display    = colorMode === 'classification' ? '' : 'none';
    recolorAll();
  });
});

// ── Tile state ────────────────────────────────────────────────────────────────

let tileStates = [];
let coordOffset = { x: 0, y: 0, z: 0 };
let lazPerf = null;

let resolveOffset;
const offsetReady = new Promise(r => { resolveOffset = r; });

function makeTile(filename) {
  return {
    url: new URL(filename, location.href).href,
    copc: null,
    byDepth: [],       // byDepth[d] = array of node entries at depth d
    maxAvailDepth: 0,
    hasRGB: false,

    box: null,         // THREE.Box3 in world-space coords

    posArr: null, zArr: null, clsArr: null, rgbArr: null, colArr: null,
    capacity: 0,
    loadedCount: 0,

    geo: null,
    mesh: null,
    group: new THREE.Group(),

    loadedDepth: -1,
    targetDepth: 0,
    loading: false,
    failed: false,

    seenClasses: new Set(),
  };
}

// Grow a tile's typed-array buffers to hold at least `needed` points.
// Recreates the Three.js geometry/attributes if the arrays are replaced.
function ensureCapacity(tile, needed) {
  if (needed <= tile.capacity) return;
  const cap = Math.ceil(needed * 1.25);

  const newPos = new Float32Array(cap * 3);
  const newZ   = new Float32Array(cap);
  const newCls = new Uint8Array(cap);
  const newCol = new Float32Array(cap * 3);
  const newRgb = tile.hasRGB ? new Uint8Array(cap * 3) : null;

  if (tile.loadedCount > 0) {
    newPos.set(tile.posArr.subarray(0, tile.loadedCount * 3));
    newZ.set(  tile.zArr.subarray(0,   tile.loadedCount));
    newCls.set(tile.clsArr.subarray(0, tile.loadedCount));
    newCol.set(tile.colArr.subarray(0, tile.loadedCount * 3));
    if (newRgb && tile.rgbArr) newRgb.set(tile.rgbArr.subarray(0, tile.loadedCount * 3));
  }

  tile.posArr = newPos; tile.zArr = newZ;
  tile.clsArr = newCls; tile.colArr = newCol; tile.rgbArr = newRgb;
  tile.capacity = cap;

  const oldGeo = tile.geo;
  tile.geo = new THREE.BufferGeometry();
  const posAttr = new THREE.BufferAttribute(newPos, 3);
  const colAttr = new THREE.BufferAttribute(newCol, 3);
  posAttr.setUsage(THREE.DynamicDrawUsage);
  colAttr.setUsage(THREE.DynamicDrawUsage);
  tile.geo.setAttribute('position', posAttr);
  tile.geo.setAttribute('color',    colAttr);
  tile.geo.setDrawRange(0, tile.loadedCount);

  if (tile.mesh) {
    tile.mesh.geometry = tile.geo;
  } else {
    tile.mesh = new THREE.Points(
      tile.geo,
      new THREE.PointsMaterial({ vertexColors: true, size: 0.5, sizeAttenuation: true })
    );
    tile.mesh.frustumCulled = false;
    tile.group.add(tile.mesh);
  }

  if (oldGeo) oldGeo.dispose();
}

function fillBuffer(tile, view) {
  const n = view.pointCount;
  ensureCapacity(tile, tile.loadedCount + n);

  const getX   = view.getter('X');
  const getY   = view.getter('Y');
  const getZ   = view.getter('Z');
  const getCls = view.getter('Classification');
  const getR   = tile.hasRGB ? view.getter('Red')   : null;
  const getG   = tile.hasRGB ? view.getter('Green') : null;
  const getB   = tile.hasRGB ? view.getter('Blue')  : null;

  const start = tile.loadedCount;
  for (let j = 0; j < n; j++) {
    const pi  = start + j;
    const pi3 = pi * 3;
    tile.posArr[pi3]   = getX(j) - coordOffset.x;
    tile.posArr[pi3+1] = getY(j) - coordOffset.y;
    tile.posArr[pi3+2] = getZ(j) - coordOffset.z;
    tile.zArr[pi]   = getZ(j) - coordOffset.z;
    const cls = getCls(j);
    tile.clsArr[pi] = cls;
    tile.seenClasses.add(cls);
    if (tile.hasRGB) {
      tile.rgbArr[pi3]   = getR(j) >> 8;
      tile.rgbArr[pi3+1] = getG(j) >> 8;
      tile.rgbArr[pi3+2] = getB(j) >> 8;
    }
  }

  applyTileColors(tile, start, start + n);
  tile.loadedCount += n;
  tile.geo.setDrawRange(0, tile.loadedCount);
  tile.geo.attributes.position.needsUpdate = true;
  tile.geo.attributes.color.needsUpdate    = true;
}

// ── Load queue (max 4 concurrent) ────────────────────────────────────────────

const loadQ = {
  tasks:  [],
  active: 0,
  max:    4,
  add(priority, fn) {
    // Don't queue duplicate tile loads — just update priority
    this.tasks.push({ priority, fn });
    this.tasks.sort((a, b) => b.priority - a.priority);
    this._pump();
  },
  _pump() {
    while (this.active < this.max && this.tasks.length > 0) {
      const { fn } = this.tasks.shift();
      this.active++;
      fn().finally(() => { this.active--; this._pump(); });
    }
  },
};

// ── LOD ───────────────────────────────────────────────────────────────────────

// Returns the desired octree depth for a tile given the current camera state.
// The heuristic: how large does the tile appear relative to the view distance?
// A tile that fills the screen needs more detail than one in the distance.
function computeTargetDepth(tile) {
  const tileSize = tile.box.max.x - tile.box.min.x;
  const cx = (tile.box.min.x + tile.box.max.x) / 2;
  const cy = (tile.box.min.y + tile.box.max.y) / 2;
  const dist2d = Math.hypot(target.x - cx, target.y - cy);
  // Use whichever is larger: zoom radius or half the distance to centre —
  // this way distant tiles don't demand the same detail as the one you're over.
  const effective = Math.max(sph.r, dist2d * 0.5);
  const screenRatio = tileSize / effective;

  if (screenRatio < 0.25) return 0;
  if (screenRatio < 0.6)  return 1;
  if (screenRatio < 1.2)  return 2;
  if (screenRatio < 2.5)  return 3;
  return Math.min(4, tile.maxAvailDepth);
}

let lodTimer = null;
function scheduleLODUpdate() {
  clearTimeout(lodTimer);
  lodTimer = setTimeout(updateLOD, 400);
}

function updateLOD() {
  // Build current frustum once
  camera.updateMatrixWorld();
  const frustum = new THREE.Frustum().setFromProjectionMatrix(
    new THREE.Matrix4().multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse)
  );

  for (const tile of tileStates) {
    if (!tile.box || tile.failed) continue;

    const visible = frustum.intersectsBox(tile.box);
    tile.group.visible = visible;

    if (!visible || tile.loading) continue;

    const want = Math.min(computeTargetDepth(tile), tile.maxAvailDepth);
    tile.targetDepth = want;

    if (tile.loadedDepth >= want) continue;

    // Priority: depth-0 loads first (overview) then closer/deeper tiles
    const priority = (want === 0 ? 200 : 100) - want * 10 - (tile.loadedDepth + 1) * 5;
    loadQ.add(priority, () => loadNextDepth(tile));
  }

  updateStatusBar();
}

async function loadNextDepth(tile) {
  if (tile.loading || tile.loadedDepth >= tile.targetDepth) return;
  tile.loading = true;

  try {
    const depth = tile.loadedDepth + 1;
    const nodes = tile.byDepth[depth] ?? [];

    for (const node of nodes) {
      if (!node.pointCount) continue;
      const view = await Copc.loadPointDataView(tile.url, tile.copc, node, { lazPerf });
      fillBuffer(tile, view);
      updateStatusBar();
      render();
      await new Promise(r => setTimeout(r, 0));  // yield so frame paints
    }

    tile.loadedDepth = depth;
  } catch (err) {
    console.error('Load error:', tile.url, err);
    tile.failed = true;
  } finally {
    tile.loading = false;
  }

  // Re-evaluate: need to go deeper after this depth completed?
  if (!tile.failed && tile.loadedDepth < tile.targetDepth) {
    updateLOD();
  }
}

// ── Status bar ────────────────────────────────────────────────────────────────

function updateStatusBar() {
  const totalPts = tileStates.reduce((s, t) => s + t.loadedCount, 0);
  const loading  = tileStates.filter(t => t.loading).length;
  const el = document.getElementById('pt-count');
  el.textContent = (totalPts / 1e6).toFixed(2) + 'M' + (loading ? ' ↓' : '');
}

// ── Tile header + hierarchy loading ───────────────────────────────────────────

async function loadHeader(tile) {
  try {
    tile.copc = await Copc.create(tile.url);
    tile.hasRGB = [2, 3, 7, 8].includes(tile.copc.header.pointDataRecordFormat);
  } catch (err) {
    console.error('Header failed:', tile.url, err);
    tile.failed = true;
  }
}

async function loadHierarchy(tile) {
  if (tile.failed) return;
  try {
    const all = {};
    async function loadPage(info) {
      const { nodes, pages } = await Copc.loadHierarchyPage(tile.url, info);
      Object.assign(all, nodes);
      for (const sub of Object.values(pages ?? {})) await loadPage(sub);
    }
    await loadPage(tile.copc.info.rootHierarchyPage);

    let maxD = 0;
    for (const [key, node] of Object.entries(all)) {
      if (!node.pointCount) continue;
      const d = parseInt(key.split('-')[0]);
      maxD = Math.max(maxD, d);
      (tile.byDepth[d] ??= []).push(node);
    }
    tile.maxAvailDepth = maxD;
  } catch (err) {
    console.error('Hierarchy failed:', tile.url, err);
    tile.failed = true;
  }
}

// ── Tree layers ───────────────────────────────────────────────────────────────

function loadTreeLayer(url, color, layerKey, countKey) {
  fetch(url).then(r => r.json()).then(trees => {
    const { x: ox, y: oy, z: oz } = coordOffset;
    const group = new THREE.Group();

    document.getElementById(countKey).textContent = trees.length.toLocaleString();

    const positions = [];
    for (const t of trees) {
      positions.push(t.x - ox, t.y - oy, t.z_bottom - oz);
      positions.push(t.x - ox, t.y - oy, t.z_top    - oz);
    }
    const lineGeo = new THREE.BufferGeometry();
    lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    const lines = new THREE.LineSegments(
      lineGeo,
      new THREE.LineDashedMaterial({ color, dashSize: 0.5, gapSize: 0.25, scale: 2.0 })
    );
    lines.computeLineDistances();
    group.add(lines);

    const sphereGeo = new THREE.SphereGeometry(0.4, 8, 8);
    const spheres   = new THREE.InstancedMesh(sphereGeo, new THREE.MeshBasicMaterial({ color }), trees.length);
    const matrix    = new THREE.Matrix4();
    trees.forEach((t, i) => {
      matrix.setPosition(t.x - ox, t.y - oy, t.z_top - oz);
      spheres.setMatrixAt(i, matrix);
    });
    spheres.instanceMatrix.needsUpdate = true;
    group.add(spheres);

    addLayer(layerKey, group);
  });
}

// ── Classification legend (built once all tiles have loaded depth 0) ──────────

let legendBuilt = false;
function maybeUpdateClsLegend() {
  if (legendBuilt) return;
  if (tileStates.some(t => !t.failed && t.loadedDepth < 0)) return;  // not all at depth 0 yet

  legendBuilt = true;
  const seen = new Set();
  for (const tile of tileStates) for (const cls of tile.seenClasses) seen.add(cls);

  const clsLegend = document.getElementById('cls-legend');
  for (const cls of [...seen].sort((a, b) => a - b)) {
    if (cls > 18) continue;
    const c = cls * 3;
    const hex = '#' + [CLS_RGB[c], CLS_RGB[c+1], CLS_RGB[c+2]]
      .map(v => Math.round(v * 255).toString(16).padStart(2, '0')).join('');
    const row = document.createElement('div');
    row.className = 'cls-row';
    row.innerHTML = `<span>${CLS_LABELS[cls]}</span><span class="cls-swatch" style="background:${hex}"></span>`;
    clsLegend.appendChild(row);
  }
}

// ── Bootstrap ─────────────────────────────────────────────────────────────────

async function init() {
  const loadingEl = document.getElementById('loading');

  lazPerf = await Las.PointData.createLazPerf({ locateFile: f => '/' + f });

  const tileFiles = await fetch('tiles.json').then(r => r.json());
  tileStates = tileFiles.map(makeTile);

  // All tile groups under one scene group so the layer toggle works
  const tilesGroup = new THREE.Group();
  for (const tile of tileStates) tilesGroup.add(tile.group);
  addLayer('pointCloud', tilesGroup);

  loadingEl.textContent = 'Loading tile headers…';
  await Promise.allSettled(tileStates.map(loadHeader));

  // Compute global coordinate offset from union of all tile bounds
  let gMinX =  Infinity, gMinY =  Infinity, gMinZ =  Infinity;
  let gMaxX = -Infinity, gMaxY = -Infinity, gMaxZ = -Infinity;
  for (const tile of tileStates) {
    if (tile.failed || !tile.copc) continue;
    const { min, max } = tile.copc.header;
    gMinX = Math.min(gMinX, min[0]); gMaxX = Math.max(gMaxX, max[0]);
    gMinY = Math.min(gMinY, min[1]); gMaxY = Math.max(gMaxY, max[1]);
    gMinZ = Math.min(gMinZ, min[2]); gMaxZ = Math.max(gMaxZ, max[2]);
  }

  coordOffset.x = (gMinX + gMaxX) / 2;
  coordOffset.y = (gMinY + gMaxY) / 2;
  coordOffset.z = gMinZ;
  globalZMin = 0;
  globalZMax = gMaxZ - gMinZ;
  resolveOffset();  // unblocks tree loading

  for (const tile of tileStates) {
    if (tile.failed || !tile.copc) continue;
    const { min, max } = tile.copc.header;
    tile.box = new THREE.Box3(
      new THREE.Vector3(min[0] - coordOffset.x, min[1] - coordOffset.y, min[2] - coordOffset.z),
      new THREE.Vector3(max[0] - coordOffset.x, max[1] - coordOffset.y, max[2] - coordOffset.z)
    );
  }

  target.set(0, 0, (gMaxZ - gMinZ) * 0.35);
  sph.r = Math.max(gMaxX - gMinX, gMaxY - gMinY) * 0.9;

  document.getElementById('z-max').textContent = Math.round(gMaxZ) + ' m';
  document.getElementById('z-min').textContent = Math.round(gMinZ) + ' m';

  const anyRGB = tileStates.some(t => t.hasRGB);
  document.getElementById('btn-rgb').style.display = anyRGB ? '' : 'none';

  loadingEl.textContent = 'Loading tile hierarchies…';
  await Promise.allSettled(tileStates.map(loadHierarchy));

  loadingEl.style.display = 'none';
  document.getElementById('ui').style.display     = 'block';
  document.getElementById('legend').style.display = 'block';

  updateLOD();
  render();
}

offsetReady.then(() => {
  loadTreeLayer('trees_p2r.json',     0xff2222, 'p2r',     'p2r-count');
  loadTreeLayer('trees_pitfree.json', 0x22ff22, 'pitfree', 'pitfree-count');
});

init().catch(err => {
  document.getElementById('loading').textContent = 'Error: ' + err.message;
  console.error(err);
});
</script>
