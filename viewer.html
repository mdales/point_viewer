<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LiDAR Point Cloud</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0f; overflow: hidden; }
    canvas { display: block; }

    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      color: #aaa;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.8;
      pointer-events: none;
    }
    #ui strong { color: #fff; font-size: 13px; }

    #layers {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: monospace;
      font-size: 12px;
    }
    .layer-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 5px 10px;
      border-radius: 4px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #ccc;
      user-select: none;
    }
    .layer-toggle:hover { background: rgba(255,255,255,0.1); }
    .layer-toggle input { cursor: pointer; accent-color: #31c884; }
    .swatch {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    #legend {
      position: absolute;
      bottom: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      font-family: monospace;
      font-size: 11px;
      color: #aaa;
    }
    #gradient {
      width: 12px;
      height: 120px;
      border-radius: 2px;
      background: linear-gradient(to bottom, #f7f79e, #31c884, #1a6b8a, #0d1b4b);
    }
    .legend-row { display: flex; align-items: center; gap: 6px; }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-family: monospace;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
<div id="loading">Loading point cloud: 0%</div>

<div id="ui" style="display:none">
  <strong id="title">LiDAR — </strong><br><br>
  drag · rotate<br>
  right-drag · pan<br>
  scroll · zoom
</div>

<div id="layers">
  <label class="layer-toggle">
    <input type="checkbox" checked data-layer="pointCloud">
    <span class="swatch" style="background:#5ad"></span>
    Point cloud - <span id="pt-count"></span>
  </label>
  <label class="layer-toggle">
    <input type="checkbox" checked data-layer="p2r">
    <span class="swatch" style="background:#f44"></span>
    Trees (p2r) - <span id="p2r-count"></span>
  </label>
  <label class="layer-toggle">
    <input type="checkbox" checked data-layer="pitfree">
    <span class="swatch" style="background:#4f4"></span>
    Trees (pit-free) - <span id="pitfree-count"></span>
  </label>
</div>

<div id="legend" style="display:none">
  <div class="legend-row"><span id="z-max"></span></div>
  <div class="legend-row"><div id="gradient"></div></div>
  <div class="legend-row"><span id="z-min"></span></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "/three@0.183.2/three.module.min.js",
    "three/addons/": "/three@0.183.2/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { PCDLoader } from 'three/addons/loaders/PCDLoader.js';

// ── Scene setup ──────────────────────────────────────────────────────────────

const scene    = new THREE.Scene();
const camera   = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100000);
camera.up.set(0, 0, 1);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ── Camera controls ──────────────────────────────────────────────────────────

let sph    = { theta: 0.4, phi: 0.5, r: 1000 };
let target = new THREE.Vector3();
let drag = false, rightDrag = false, prev = { x: 0, y: 0 };
let prevPinchDist = null;

function pinchDist(touches) {
  return Math.hypot(
    touches[0].clientX - touches[1].clientX,
    touches[0].clientY - touches[1].clientY
  );
}

function render() {
  camera.position.set(
    target.x + sph.r * Math.sin(sph.phi) * Math.sin(sph.theta),
    target.y + sph.r * Math.sin(sph.phi) * Math.cos(sph.theta) * -1.0,
    target.z + sph.r * Math.cos(sph.phi)
  );
  camera.lookAt(target);
  renderer.render(scene, camera);
}

renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

renderer.domElement.addEventListener('mousedown', e => {
  drag = true; rightDrag = e.button === 2;
  prev = { x: e.clientX, y: e.clientY };
});

renderer.domElement.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    rightDrag = true;
    prevPinchDist = pinchDist(e.touches);
    prev = {
      x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
      y: (e.touches[0].clientY + e.touches[1].clientY) / 2
    };
  } else {
    rightDrag = false; prevPinchDist = null;
    prev = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
  drag = true;
});

['mouseup', 'touchend'].forEach(ev => window.addEventListener(ev, () => drag = false));

window.addEventListener('mousemove', e => {
  if (!drag) return;
  applyDrag(e.clientX - prev.x, e.clientY - prev.y);
  prev = { x: e.clientX, y: e.clientY };
  render();
});

window.addEventListener('touchmove', e => {
  if (!drag) return;
  e.preventDefault();
  if (e.touches.length === 2) {
    const d = pinchDist(e.touches);
    if (prevPinchDist !== null) {
      sph.r = Math.max(10, Math.min(50000, sph.r * (prevPinchDist / d)));
    }
    prevPinchDist = d;
  }
  const x = e.touches.length === 2
    ? (e.touches[0].clientX + e.touches[1].clientX) / 2 : e.touches[0].clientX;
  const y = e.touches.length === 2
    ? (e.touches[0].clientY + e.touches[1].clientY) / 2 : e.touches[0].clientY;
  applyDrag(x - prev.x, y - prev.y);
  prev = { x, y };
  render();
}, { passive: false });

renderer.domElement.addEventListener('wheel', e => {
  sph.r = Math.max(10, Math.min(50000, sph.r * (1 + e.deltaY * 0.001)));
  render();
}, { passive: true });

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function applyDrag(dx, dy) {
  if (rightDrag) {
    const right = new THREE.Vector3(Math.cos(sph.theta), 0, -Math.sin(sph.theta));
    target.addScaledVector(right, -dx * sph.r * 0.001);
    target.addScaledVector(new THREE.Vector3(0, 1, 0), dy * sph.r * 0.001);
  } else {
    sph.theta -= dx * 0.005;
    sph.phi = Math.max(0.05, Math.min(Math.PI * 0.95, sph.phi - dy * 0.005));
  }
}

// ── Layer registry + toggle UI ───────────────────────────────────────────────

const layers = {};  // key → THREE.Group, populated as data loads

document.querySelectorAll('#layers input[type=checkbox]').forEach(checkbox => {
  checkbox.addEventListener('change', () => {
    const group = layers[checkbox.dataset.layer];
    if (group) {
      group.visible = checkbox.checked;
      render();
    }
    // if data hasn't loaded yet the group will respect .visible when it does
  });
});

function addLayer(key, group) {
  layers[key] = group;
  // honour checkbox state that may have been set before load finished
  const checkbox = document.querySelector(`input[data-layer="${key}"]`);
  if (checkbox) group.visible = checkbox.checked;
  scene.add(group);
  render();
}

// ── Loaders ──────────────────────────────────────────────────────────────────

const pcdLoader = new PCDLoader();

// Point cloud
pcdLoader.load(
  'passage.pcd',
  pts => {
    pts.geometry.computeBoundingBox();
    const box = pts.geometry.boundingBox;
    box.getCenter(target);
    sph.r = box.getSize(new THREE.Vector3()).length() * 0.7;

    pts.material.size = 0.8;

    const group = new THREE.Group();
    group.add(pts);
    addLayer('pointCloud', group);

    const n = pts.geometry.attributes.position.array.length / 3;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('ui').style.display     = 'block';
    document.getElementById('legend').style.display = 'block';
    document.getElementById('pt-count').textContent = n.toLocaleString() + ' points';
  },
  e => {
    const pct = Math.floor((e.loaded / e.total) * 100);
    document.getElementById('loading').textContent = `Loading point cloud: ${pct}%`;
  }
);

// Tree layers — one function handles both datasets
function loadTreeLayer(url, color, layerKey, countKey) {
  const hexColor = new THREE.Color(color);

  fetch(url)
    .then(r => r.json())
    .then(trees => {
      const group = new THREE.Group();


      document.getElementById(countKey).textContent = trees.length + ' points';

      // Line segments: stem base → crown apex
      const positions = [];
      for (const t of trees) {
        positions.push(t.x, t.y, t.z_bottom);
        positions.push(t.x, t.y, t.z_top);
      }
      const lineGeo = new THREE.BufferGeometry();
      lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      const lines = new THREE.LineSegments(
        lineGeo,
        new THREE.LineDashedMaterial({ color, dashSize: 0.5, gapSize: 0.25, scale: 2.0 })
      );
      lines.computeLineDistances();
      group.add(lines);

      // Instanced spheres at crown apex
      const sphereGeo = new THREE.SphereGeometry(0.4, 8, 8);
      const spheres   = new THREE.InstancedMesh(sphereGeo, new THREE.MeshBasicMaterial({ color }), trees.length);
      const matrix    = new THREE.Matrix4();
      trees.forEach((t, i) => {
        matrix.setPosition(t.x, t.y, t.z_top);
        spheres.setMatrixAt(i, matrix);
      });
      spheres.instanceMatrix.needsUpdate = true;
      group.add(spheres);

      addLayer(layerKey, group);
    });
}

loadTreeLayer('trees_p2r.json',     0xff2222, 'p2r',     'p2r-count');
loadTreeLayer('trees_pitfree.json', 0x22ff22, 'pitfree', 'pitfree-count');

// Metadata
fetch('kullberg.json')
  .then(r => r.json())
  .then(meta => {
    document.getElementById('z-max').textContent = Math.round(meta.zMax) + ' m';
    document.getElementById('z-min').textContent = Math.round(meta.zMin) + ' m';
    document.getElementById('title').textContent = 'LiDAR — ' + meta.name;
  });

</script>
</body>
</html>
